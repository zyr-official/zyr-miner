<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZYR Miner</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { background: #0f172a; color: #fff; font-family: sans-serif; text-align: center; padding: 20px; }
        .card { background: #1e293b; padding: 20px; border-radius: 12px; margin-top: 20px; }
        button { background: #38bdf8; border: none; padding: 12px 20px; color: #0f172a; font-weight: bold; border-radius: 8px; cursor: pointer; margin-top: 10px; }
    </style>
</head>
<body>
    <h1>⚡ ZYR Cloud Miner</h1>
    <div class="card">
        <h3>Balance: <span id="balance">0.00</span> ZYR</h3>
        <p>Pending: <span id="pending">0.00</span> ZYR</p>
        <button onclick="claimTokens()">Claim Tokens</button>
    </div>

    <div class="card">
        <h3>Referral Link</h3>
        <p id="ref-link">Loading...</p>
        <button onclick="copyRef()">Copy Invite Link</button>
    </div>

    <script>
        const API_URL = "https://nann.pingooshop.ir"; 
        const tg = window.Telegram.WebApp;
        tg.expand();

        const user = tg.initDataUnsafe?.user || { id: "1839907139", first_name: "Admin" };
        
        const urlParams = new URLSearchParams(window.location.search);
        let referrerId = urlParams.get('startapp') || urlParams.get('ref');
        if (referrerId) {
            referrerId = referrerId.replace('ref_', '');
        }

        document.getElementById('ref-link').innerText = `https://t.me/ZYRMining_bot/app?startapp=ref_${user.id}`;

        async function syncUser() {
            try {
                let res = await fetch(`${API_URL}/sync-user`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        user_id: String(user.id),
                        first_name: user.first_name || "Miner",
                        referrer_id: referrerId ? String(referrerId) : null
                    })
                });
                let data = await res.json();
                document.getElementById('balance').innerText = data.balance;
                document.getElementById('pending').innerText = data.pending;
            } catch (e) {
                console.error("Sync error:", e);
            }
        }

        async function claimTokens() {
            try {
                let res = await fetch(`${API_URL}/claim`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_id: String(user.id) })
                });
                let data = await res.json();
                if (data.ok) {
                    document.getElementById('balance').innerText = data.balance;
                    document.getElementById('pending').innerText = "0.00";
                    alert("Claimed successfully!");
                }
            } catch (e) {
                console.error("Claim error:", e);
            }
        }

        function copyRef() {
            navigator.clipboard.writeText(`https://t.me/ZYRMining_bot/app?startapp=ref_${user.id}`);
            alert("Referral link copied!");
        }

        syncUser();
        setInterval(syncUser, 10000);
    </script>
</body>
</html>
